name: Publish package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: react-number-easing-package-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Check package version
        id: version
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")

          if ! published_versions=$(npm view "$package_name" versions --json); then
            echo "### Could not verify published versions for ${package_name}; refusing to publish" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if node -e '
            const published = JSON.parse(process.argv[1]);
            const versions = Array.isArray(published) ? published : [published];
            process.exit(versions.includes(process.argv[2]) ? 0 : 1);
          ' "$published_versions" "$package_version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### ${package_name}@${package_version} is already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "### Publishing ${package_name}@${package_version}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # npm publishes the README from the packed tarball; pnpm currently does not.
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish
