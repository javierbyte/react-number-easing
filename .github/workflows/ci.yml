name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify the committed build matches source
        run: git diff --exit-code -- src

      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm build
        working-directory: website

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react:
          - '17.0.2'
          - '18.3.1'
          - '19.3.1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Install React ${{ matrix.react }} compatibility runtime
        run: >-
          pnpm add --save-dev --lockfile=false
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          react-test-renderer@${{ matrix.react }}
      - run: pnpm test:compat
